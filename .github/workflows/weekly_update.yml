name: Automated Weekly NFL Fantasy Pipeline

on:
  schedule:
    # Runs every Wednesday at 12:00 UTC (8:00 AM EDT / 7:00 AM EST) after MNF & Tuesday waivers/rosters finalize
    - cron: "0 12 * * 3"
    # Runs every Friday at 12:00 UTC (8:00 AM EDT / 7:00 AM EST) after TNF & Friday injury reports
    - cron: "0 12 * * 5"
  workflow_dispatch: # Allows manual one-click execution from the GitHub Actions tab

permissions:
  contents: write

jobs:
  run-fantasy-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute NFL Data & Valuation Pipeline
        run: |
          python 01_fetch_data.py
          python 02_feature_engineering.py
          python 03_train_qb_model.py
          python 03_train_rb_model.py
          python 03_train_wr_model.py
          python 03_train_te_model.py
          python 04_generate_buy_sell_signals.py

      - name: Commit and push updated CSV data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --staged --quiet; then
            echo "No changes in data/*.csv to commit."
          else
            git commit -m "chore(data): automated weekly NFL stats & xFP valuation refresh"
            git push
          fi
